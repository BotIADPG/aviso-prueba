<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba de avisos</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 24px 16px; background: #f4f6fa; color: #1b2433; }
  main { max-width: 420px; margin: 0 auto; }
  h1 { font-size: 22px; }
  input { width: 100%; box-sizing: border-box; padding: 14px; font-size: 20px; margin-bottom: 12px; border: 1px solid #b8c0cc; border-radius: 10px; }
  button { width: 100%; padding: 16px; font-size: 18px; border: 0; border-radius: 10px; background: #1E3F77; color: #fff; }
  #estado { margin-top: 16px; padding: 12px; border-radius: 8px; background: #fff; min-height: 1.4em; }
  small { color: #5b6577; }
</style>
</head>
<body>
<main>
  <h1>Prueba de avisos (v2)</h1>
  <p>Página temporal. Escribe tu celular y activa los avisos.</p>
  <input id="cel" type="tel" inputmode="numeric" placeholder="Celular a 10 dígitos" autocomplete="tel">
  <button id="activar">Activar avisos</button>
  <div id="estado">Sin activar.</div>
  <p><small>En iPhone: primero Compartir → "Agregar a inicio" y ábrela desde ese ícono.</small></p>
</main>
<script>
const CLAVE = 'BKVh6q993yXIuf2ert4ecnlWbfz-4XuW1Gm_Ql66hugt9CyD8i6S4sKe5mEW-P9Ps4j48zWGJsiakgbiKYOiTVA';
const REGISTRO = 'https://aris.gilm.com.mx:5443/webhook/avisos-registro';
const estado = document.getElementById('estado');

function aBytes(b64) {
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(raw, c => c.charCodeAt(0));
}

document.getElementById('activar').addEventListener('click', async () => {
  try {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
      estado.textContent = 'Este navegador no soporta avisos (en iPhone: agrégala a inicio primero).';
      return;
    }
    const permiso = await Notification.requestPermission();
    if (permiso !== 'granted') { estado.textContent = 'Permiso negado: ' + permiso; return; }
    const reg = await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    const vieja = await reg.pushManager.getSubscription();
    if (vieja) await vieja.unsubscribe(); // la suscripción anterior está ligada a otra llave
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: aBytes(CLAVE) });
    const r = await fetch(REGISTRO, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ celular: document.getElementById('cel').value, sub: sub.toJSON(), ua: navigator.userAgent }) });
    const j = await r.json();
    estado.textContent = j.ok ? '✅ Avisos activados para ···' + j.tel10.slice(-4) + '. Ya puedes cerrar y bloquear.' : 'Error: ' + j.error;
  } catch (e) {
    estado.textContent = 'Error: ' + e.message;
  }
});
</script>
</body>
</html>
