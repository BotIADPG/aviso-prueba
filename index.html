<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba de avisos</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 24px 16px; background: #f4f6fa; color: #1b2433; }
  main { max-width: 420px; margin: 0 auto; }
  h1 { font-size: 22px; }
  button { width: 100%; padding: 16px; font-size: 18px; border: 0; border-radius: 10px; background: #1E3F77; color: #fff; }
  #estado { margin-top: 16px; padding: 12px; border-radius: 8px; background: #fff; min-height: 1.4em; }
  small { color: #5b6577; }
</style>
</head>
<body>
<main>
  <h1>Prueba de avisos</h1>
  <p>Página temporal para probar si los avisos llegan con el teléfono bloqueado.</p>
  <button id="activar">Activar avisos</button>
  <div id="estado">Sin activar.</div>
  <p><small>En iPhone: primero Compartir → "Agregar a inicio" y ábrela desde ese ícono.</small></p>
</main>
<script>
const CLAVE = 'BO4ibMw8EHi-VOz7LAt-1nWJQVvglzUvNDoctY60BbwynE61XOsh2x07d93h7QXg4fv-7GAZA94My5kBKQB19gc';
const REGISTRO = 'https://aris.gilm.com.mx:5443/webhook/avisos-web-k3p9';
const estado = document.getElementById('estado');

function aBytes(b64) {
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(raw, c => c.charCodeAt(0));
}

document.getElementById('activar').addEventListener('click', async () => {
  try {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
      estado.textContent = 'Este navegador no soporta avisos (en iPhone: agrégala a inicio primero).';
      return;
    }
    const permiso = await Notification.requestPermission();
    if (permiso !== 'granted') { estado.textContent = 'Permiso negado: ' + permiso; return; }
    const reg = await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: aBytes(CLAVE) });
    const r = await fetch(REGISTRO, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sub: sub.toJSON(), ua: navigator.userAgent, ts: new Date().toISOString() }) });
    estado.textContent = r.ok ? '✅ Avisos activados. Ya puedes cerrar y bloquear el teléfono.' : 'Error al registrar: ' + r.status;
  } catch (e) {
    estado.textContent = 'Error: ' + e.message;
  }
});
</script>
</body>
</html>
